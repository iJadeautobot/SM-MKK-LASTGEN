<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Founder Card</title>
  <style>
    :root {
      --gold: #ffd000;
      --surface: #140d0a;
      --border: rgba(255, 208, 0, 0.35);
      --text: #e0e0e0;
    }

    body {
      background-color: #0b0604;
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 40px 20px;
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 1000px; /* กำหนดขนาดความกว้างหลักของคอนเทนเนอร์ */
      margin: 0 auto;
    }

    /* 1. การ์ดหลัก (กำหนด overflow: visible เพื่อไม่ให้โดนตัดมงกุฎ) */
    .member-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
      position: relative;
      overflow: visible; /* <<-- สำคัญ: เปิดให้มงกุฎลอยออกนอกกรอบได้ */
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 25px;
    }

    /* 2. การ์ด FOUNDER ขยายใหญ่สุด 100% เท่ากรอบ LEADERS ด้านล่าง */
    .member-card.founder {
      border-color: rgba(255, 208, 0, 0.5);
      background: linear-gradient(145deg, #180c06, #2a1608);
      width: 100%;
      max-width: 100%; /* <<-- ขยายกรอบให้ใหญ่สุด */
      box-sizing: border-box;
    }

    /* 3. มงกุฎลอยอยู่นอกมุมขวาบน */
    .crown-icon {
      position: absolute;
      top: -22px;        /* <<-- ดันขึ้นบนพ้นขอบ */
      right: -18px;       /* <<-- ดันไปทางขวาพ้นขอบ */
      width: 60px;
      height: 60px;
      fill: var(--gold);
      transform: rotate(20deg);
      filter: drop-shadow(0 0 8px rgba(255, 208, 0, 0.7));
      pointer-events: none;
      z-index: 10;
    }

    /* รูปโปรไฟล์ / ตัวเลข */
    .member-avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a07800, #ffd000);
      color: #1a1200;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      margin: 0 auto 12px;
      box-shadow: 0 0 15px rgba(255, 208, 0, 0.3);
    }

    .member-name {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 16px;
    }

    /* ปุ่มกด */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      max-width: 200px;
      margin: 0 auto;
    }

    .btn {
      width: 100%;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-facebook {
      background: #3b1111;
      color: #ff8080;
      border: 1px solid #661a1a;
    }

    .btn-kick {
      background: #122b0b;
      color: #00ff66;
      border: 1px solid #1e4d13;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 6px #00ff66;
    }

    /* กรอบ LEADERS ด้านล่าง */
    .leaders-box {
      background: #140d0a;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      font-weight: bold;
      color: var(--gold);
      letter-spacing: 2px;
      font-size: 18px;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- FOUNDER CARD -->
  <div class="member-card founder">
    <!-- ไอคอนมงกุฎมุมขวาบน -->
    <svg class="crown-icon" viewBox="0 0 24 24">
      <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
    </svg>

    <div class="member-avatar">1</div>
    <div class="member-name">1</div>

    <div class="btn-group">
      <button class="btn btn-facebook">FACEBOOK</button>
      <button class="btn btn-kick"><span class="dot"></span> KICK</button>
    </div>
  </div>

  <!-- LEADERS BOX -->
  <div class="leaders-box">
    LEADERS
  </div>

</div>

</body>
</html>
